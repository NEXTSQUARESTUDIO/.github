name: Bug report
description: Report a problem with clear steps to reproduce it.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Thanks for helping us improve. Please remove passwords, tokens, and personal information from screenshots and logs."
  - type: input
    id: version
    attributes:
      label: Product and version
      description: Which game, app, or repository version is affected?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and operating system
      placeholder: "Example: Windows 11, Android device, iPhone, or browser"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open...\n2. Select...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or relevant logs
      description: Optional. Remove sensitive information before attaching anything.
